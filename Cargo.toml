[package]
name = "certval-awslc"
version = "0.1.0-rc.1"
description = """
AWS-LC crypto provider for certval. Performs message digest calculation and certificate signature
verification with AWS-LC through aws-lc-rs, including its FIPS-validated build, so certification
path validation can use a validated module that ships inside the binary. With `cms`, certval-cms's
content encryption, key transport, key agreement, KEM and signing go through AWS-LC too.
"""
license = "Apache-2.0 OR MIT"
repository = "https://github.com/carl-wallace/certval-awslc"
categories = ["cryptography"]
keywords = ["x509", "certval", "aws-lc", "fips"]
readme = "README.md"
edition = "2021"
rust-version = "1.89"
include = ["src/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE-APACHE", "LICENSE-MIT"]

[features]
default = ["non-fips"]
# AWS-LC built from its ordinary source. Needs a C compiler only.
non-fips = ["aws-lc-rs/non-fips"]
# AWS-LC's FIPS module, built from the source its validation covers. Needs CMake and Go to build, and
# is the validated module only where the build follows the module's security policy on an operating
# environment its certificate lists. aws-lc-rs refuses to build with both this and non-fips enabled.
fips = ["aws-lc-rs/fips"]
# Enables certval's software ML-DSA implementation. The provider needs nothing from it, but without
# it the ML-DSA tests have no software verdict to compare against.
pqc = ["certval/pqc"]
# Implements certval-cms's content encryption and decryption, key transport, key agreement and KEM
# interfaces, and recipient and signing credentials over AWS-LC keys.
cms = ["dep:certval-cms", "dep:pkcs8", "dep:x509-cert", "dep:zeroize"]

[dependencies]
certval = { version = "0.2.0-rc.2", default-features = false }

aws-lc-rs = { version = "1.19.0", default-features = false, features = ["alloc"] }
const-oid = { version = "0.10.2", features = ["db"] }
der = { version = "0.8.3", features = ["alloc", "derive", "oid"] }
spki = "0.8.0"

log = "0.4.33"

# Under the `cms` feature.
certval-cms = { version = "0.1.0-rc.1", optional = true }
pkcs8 = { version = "0.11.0", optional = true }
x509-cert = { version = "0.3.0", default-features = false, optional = true }
zeroize = { version = "1.8.1", optional = true }

[dev-dependencies]
# certval's software RSA, which the tests compare this provider's verdicts against. A dev-dependency,
# so the application, not this crate, decides which algorithms certval's software offers.
certval = { version = "0.2.0-rc.2", default-features = false, features = ["rsa"] }
x509-cert = { version = "0.3.0", features = ["builder", "hazmat"] }
# The cms tests: keys generated in software, certificates for them, recipient identifiers, and the
# random number generator certval-cms's builders take.
cms = "=0.3.0-rc.1"
elliptic-curve = { version = "0.14.3", features = ["arithmetic"] }
getrandom = { version = "0.4.1", features = ["sys_rng"] }
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa", "pkcs8"] }
p384 = { version = "0.14.0", features = ["ecdh", "pkcs8"] }
p521 = { version = "0.14.0", features = ["ecdh", "pkcs8"] }
rand_core = "0.10.1"
rsa = { version = "=0.10.0-rc.21", features = ["encoding"] }
sha1 = "0.11.0"

[package.metadata.docs.rs]
# The fips feature needs CMake and Go, which docs.rs does not provide; the API is the same.
features = ["cms", "pqc"]
rustdoc-args = ["--cfg", "docsrs"]

[patch.crates-io]
# certval-cms is not on crates.io yet, so the `cms` feature takes it from the neighboring checkout.
# Remove this once it publishes.
certval-cms = { path = "../certval-cms" }
# Uncomment while developing certval and this crate together: it redirects the crates.io dependency
# above to the local checkout, so edits take effect without a publish. Leave it commented on anything
# that is committed, or the build depends on a path that only exists here.
# certval = { path = "../rust-pki/certval" }
