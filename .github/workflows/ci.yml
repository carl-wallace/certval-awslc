name: certval-awslc

on:
  pull_request:
  push:
    branches: main
  # Manual re-runs via `gh workflow run ci.yml` (available once this file is
  # on the default branch).
  workflow_dispatch:

defaults:
  run:
    working-directory: certval-awslc

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"

# Cancels CI jobs when new commits are pushed to a PR branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.88.0 # MSRV, matching certval
          - stable
    steps:
      # certval comes from crates.io, so no sibling checkout is needed here.
      - uses: actions/checkout@v7
        with:
          path: certval-awslc
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo build --all-targets
      - run: cargo build --all-targets --features pqc

  # Lints run on stable only, deliberately not across the build matrix: clippy's diagnostics differ
  # between toolchains, so linting against the MSRV pin reports on a compiler nobody develops with.
  # Not --all-features, which would select the fips build; test-fips builds that.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: certval-awslc
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Not installed by default.
          components: clippy
      - run: cargo clippy --all-targets
      - run: cargo clippy --all-targets --features pqc

  # A job of its own so it can be a required check without making clippy one: each Rust release
  # adds lints, and a required clippy would fail unrelated pull requests.
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: certval-awslc
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Not installed by default.
          components: rustfmt
      - run: cargo fmt --check

  # Against AWS-LC's ordinary build.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: certval-awslc
      # The certificate collections live in rust-pki's test data and are pointed at rather than
      # copied, which is what the environment variables below are for. Pinned to the commit the
      # certval release in Cargo.toml was published from (certval-v0.2.0-rc.1); bump both together.
      - uses: actions/checkout@v7
        with:
          repository: carl-wallace/rust-pki
          ref: 93104f49a8083f1e527e3b4e830581b917674e2f
          path: rust-pki
      - uses: dtolnay/rust-toolchain@stable
      - name: Run the unit, signature and collection tests
        env:
          CERTVAL_AWSLC_RSA_CERTS: ${{ github.workspace }}/rust-pki/certval/tests/examples/PKITS_data_2048/certs
          CERTVAL_AWSLC_ECDSA_CERTS: ${{ github.workspace }}/rust-pki/certval/tests/examples/PKITS_data_p256/certs
          CERTVAL_AWSLC_PSS_CERTS: ${{ github.workspace }}/rust-pki/certval/tests/examples/rsapss
          CERTVAL_AWSLC_MLDSA_CERTS: ${{ github.workspace }}/rust-pki/certval/tests/examples/pkits_ml_dsa_65/certs
          # One SLH-DSA set: the software verifier the results are compared against is slow in a
          # debug build, and AWS-LC declines SLH-DSA, so one set exercises the fall-through.
          CERTVAL_AWSLC_SLHDSA_CERTS: ${{ github.workspace }}/rust-pki/certval/tests/examples/pkits_slh_dsa_sha2_128f/certs
        # --nocapture so the per-family tallies land in the log: they are the only way to see how
        # much AWS-LC answered, as opposed to software.
        run: cargo test --features pqc -- --nocapture

  # The same tests against AWS-LC's FIPS module, which aws-lc-rs builds from source with CMake and
  # Go (both on the hosted Ubuntu image). CERTVAL_AWSLC_EXPECT_FIPS makes a build that is not in FIPS
  # mode fail rather than pass as the ordinary one.
  test-fips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: certval-awslc
      - uses: actions/checkout@v7
        with:
          repository: carl-wallace/rust-pki
          ref: 93104f49a8083f1e527e3b4e830581b917674e2f
          path: rust-pki
      - uses: dtolnay/rust-toolchain@stable
      - name: Show the build tools the FIPS module needs
        run: |
          cmake --version
          go version
      - name: Run the tests against the FIPS module
        env:
          CERTVAL_AWSLC_EXPECT_FIPS: "1"
          CERTVAL_AWSLC_RSA_CERTS: ${{ github.workspace }}/rust-pki/certval/tests/examples/PKITS_data_2048/certs
          CERTVAL_AWSLC_ECDSA_CERTS: ${{ github.workspace }}/rust-pki/certval/tests/examples/PKITS_data_p256/certs
          CERTVAL_AWSLC_PSS_CERTS: ${{ github.workspace }}/rust-pki/certval/tests/examples/rsapss
          CERTVAL_AWSLC_MLDSA_CERTS: ${{ github.workspace }}/rust-pki/certval/tests/examples/pkits_ml_dsa_65/certs
        run: cargo test --no-default-features --features fips,pqc -- --nocapture
